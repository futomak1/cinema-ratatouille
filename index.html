e":"「マンスリーチェック11月Part2」"},{"t":"1:12:41","sec":4361,"films":["済州島 声たち"],"section":"","line":"『済州島 声たち』"},{"t":"1:18:46","sec":4726,"films":["アヴェドン"],"section":"","line":"『アヴェドン』"},{"t":"1:23:42","sec":5022,"films":["すべて真夜中の恋人たち"],"section":"","line":"『すべて真夜中の恋人たち』"},{"t":"1:26:38","sec":5198,"films":["呪いのスマホ"],"section":"","line":"『呪いのスマホ』"},{"t":"1:30:14","sec":5414,"films":["アメリ"],"section":"","line":"『アメリ』"},{"t":"1:31:27","sec":5487,"films":["ムクドリと人生とレモンパスタ"],"section":"","line":"『ムクドリと人生とレモンパスタ』"},{"t":"1:36:31","sec":5791,"films":[],"section":"「シネマの帽子」","line":"「シネマの帽子」"},{"t":"1:44:20","sec":6260,"films":[],"section":"「お便り紹介」","line":"「お便り紹介」"}],"text":"00:00 「オープニング」\n12:43 「最近何見た」\n13:20 『NAZA ナザ』\n17:15 『DIGGER／ディガー』\n18:08 『耳をすませば』\n20:05 『バイオハザード』\n23:43 『ストリートファイター　ザ・ムービー』\n25:25 『ひつじのショーン　かぼちゃ畑の怪物！』\n27:33 「最近何見た」メール\n33:09 「映画祭インフォ」「ワイダ・ジェネレーション」\n34:51 『世代』\n39:44 『コルチャック先生』「久山宏一さん追悼」\n42:22 「ポーランド映画祭」\n43:18 『人形』\n46:53 『ホット・スポット』\n49:47 『HEEL／ヒール』\n55:20 「キェシロフスキ没後30年 トリコロール三部作」\n57:04 「ライナー・ヴェルナー・ファスビンダー　ラブ＆デスペア」\n1:01:35 『少しの愛だけでも』\n1:05:46 『デスペア　光明への旅』\n1:12:03 「マンスリーチェック11月Part2」\n1:12:41 『済州島 声たち』\n1:18:46 『アヴェドン』\n1:23:42 『すべて真夜中の恋人たち』\n1:26:38 『呪いのスマホ』\n1:30:14 『アメリ』\n1:31:27 『ムクドリと人生とレモンパスタ』\n1:36:31 「シネマの帽子」\n1:44:20 「お便り紹介」\n2:05:10 「エンディング」"}]</script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  // ---- ページ自身がデータの保管場所。描画前に静的部分を控えておき、保存時に丸ごと書き直す
  const SELF_SRC=document.currentScript?document.currentScript.textContent:"";
  const PARTS=["title",'meta[name="claude:viewport-fit-sides"]','link[rel="stylesheet"]',"body > style","header.band","main"]
    .map(s=>{const el=document.querySelector(s);return el?el.outerHTML:""}).join("\n");
  const RESET=(document.head.querySelector("style")||{}).textContent||"";
  let episodes=[]; try{episodes=JSON.parse($("#seed").textContent)||[]}catch(e){episodes=[]}
  let art=null; let canWrite=false;
  function buildDoc(eps){
    const json=JSON.stringify(eps).replace(/</g,"\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
      +PARTS+'\n<script type="application/json" id="seed">'+json+'<\/script>\n<script>'+SELF_SRC+'<\/script>\n</body></html>';
  }
  async function persist(eps){
    if(!art) throw {code:"not_granted"};
    await art.publish(buildDoc(eps.slice().sort((a,b)=>a.no-b.no)));
  }
  function trimText(t){
    t=t||""; const i=t.search(/矢田部吉彦映画チャンネル\s*[”"“]?\s*シネマラタトゥイユ/);
    return (i>0?t.slice(0,i):t).trim();
  }

  // ---- 文字の正規化（全角半角・ひらがなカタカナ・記号の揺れを吸収）
  function norm(s){
    s=(s||"").normalize("NFKC").toLowerCase();
    s=s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
    return s.replace(/[\s・･·\-‐―－_:：、。,.!！?？「」『』"'“”‘’（）()\[\]〜~]/g,"");
  }
  function toSec(t){const p=t.split(":").map(Number);return p.reduce((a,b)=>a*60+b,0)}
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

  // ---- 概要欄のパース
  function parse(text){
    const items=[];
    for(const raw of text.split(/\r?\n/)){
      const m=raw.trim().match(/^((?:\d{1,2}:)?\d{1,2}:\d{2})\s*(.+)$/);
      if(!m){
        const films=[...raw.matchAll(/『([^』]+)』/g)].map(x=>x[1].trim());
        if(films.length) items.push({t:null,sec:null,films,section:"概要欄",line:raw.trim()});
        continue;
      }
      const t=m[1], rest=m[2].trim();
      const films=[...rest.matchAll(/『([^』]+)』/g)].map(x=>x[1].trim());
      const section=rest.replace(/『[^』]*』/g,"").replace(/\s+/g," ").trim();
      if(/^「?(オープニング|エンディング)」?[​-‏⁠﻿]*$/.test(rest)) continue;
      items.push({t,sec:toSec(t),films,section,line:rest});
    }
    return dedupe(items);
  }
  // 同じ回で同じ作品名が2回目以降に出たら外す（表記ゆれ「・」や空白の有無も同じとみなす）
  function dedupe(items){
    const seen=new Set(), out=[];
    for(const it of items||[]){
      if(!it.films||!it.films.length){out.push(it);continue}
      // 表示用の行からも、すでに出た『作品名』を取り除く
      const films=[];
      const line=String(it.line||"").replace(/『([^』]+)』/g,(m,f)=>{const k=norm(f.trim());if(seen.has(k))return "";seen.add(k);films.push(f.trim());return m})
        .replace(/[ 　]{2,}/g," ").trim();
      if(films.length) out.push(Object.assign({},it,{films,line}));
    }
    return out;
  }

  function epLink(ep,sec){
    if(ep.url){
      try{const u=new URL(ep.url);u.searchParams.delete("si");if(sec!=null)u.searchParams.set("t",sec+"s");return u.toString()}catch(e){}
    }
    return "https://www.youtube.com/results?search_query="+encodeURIComponent("シネマラタトゥイユ #"+ep.no);
  }
  function tsHTML(ep,it){
    if(it.t==null) return `<a class="ts" href="${esc(epLink(ep,null))}" target="_blank" rel="noopener" title="動画を開く">動画</a>`;
    return `<a class="ts" href="${esc(epLink(ep,it.sec))}" target="_blank" rel="noopener" title="${ep.url?'その場面から再生':'YouTubeで回を探す'}">${esc(it.t)}</a>`}
  function snippets(ep,q){
    const out=[];
    for(const line of trimText(ep.text).split(/\r?\n/)){
      if(line.trim() && norm(line).includes(q)) out.push(line.trim().length>90?line.trim().slice(0,90)+"…":line.trim());
      if(out.length>=2) break;
    }
    return out;
  }

  // ---- 検索
  function hl(text,q){
    if(!q) return esc(text);
    const i=text.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return esc(text);
    return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
  }
  function render(){
    const qRaw=$("#q").value.trim(), q=norm(qRaw);
    const groups=new Map();
    for(const ep of episodes){
      for(const it of ep.items||[]){
        const keys=it.films.length?it.films:[it.section];
        for(const k of keys){
          const hay=norm(k)+" "+(it.films.length?norm(it.section):"");
          if(q && !norm(k).includes(q) && !norm(it.section).includes(q)) continue;
          const key=norm(k);
          if(!groups.has(key)) groups.set(key,{name:k,topic:!it.films.length,hits:[]});
          groups.get(key).hits.push({ep,it});
        }
      }
    }
    const box=$("#results");
    if(!episodes.length){box.innerHTML=`<div class="empty">まだ回が登録されていません。<br>「回を追加」から概要欄を貼り付けてください。</div>`;return}
    const textHits=q?episodes.filter(ep=>norm(trimText(ep.text)).includes(q)||(ep.items||[]).some(it=>norm(it.line).includes(q))).sort((a,b)=>b.no-a.no):[];
    if(!groups.size&&!textHits.length){box.innerHTML=`<div class="empty">「${esc(qRaw)}」は見つかりませんでした。<br>表記ゆれ（原題・副題・姓だけ）でも試してみてください。</div>`;return}
    const sk=x=>x==null?1e9:x;
    const arr=[...groups.values()];
    arr.forEach(g=>g.hits.sort((a,b)=>b.ep.no-a.ep.no||sk(a.it.sec)-sk(b.it.sec)));
    arr.sort((a,b)=>q?(a.name.length-b.name.length):(b.hits[0].ep.no-a.hits[0].ep.no||sk(a.hits[0].it.sec)-sk(b.hits[0].it.sec)));
    const shown=q?arr:arr.slice(0,60);
    // 作品別の結果にすでに出ている回は、重ねて表示しない。本文にしか出てこない回だけを残す
    const covered=new Set(); shown.forEach(g=>g.hits.forEach(h=>covered.add(h.ep.no)));
    const extra=textHits.filter(ep=>!covered.has(ep.no));
    const epsHTML=extra.length?`<h3 class="grp">${shown.length?"ほかに本文で":""}「${esc(qRaw)}」が出てくる回 <span>${extra.length}回</span></h3><div class="chips">${extra.map(ep=>`<a class="chip" href="${esc(epLink(ep,null))}" target="_blank" rel="noopener">#${ep.no}</a>`).join("")}</div>${
      extra.map(ep=>{const sn=snippets(ep,q);const lines=sn.length?sn:(ep.items||[]).filter(it=>norm(it.line).includes(q)).slice(0,2).map(it=>it.line);
        return `<div class="hit"><span class="ep">#${ep.no}</span><span class="sec">${lines.map(l=>hl(l,qRaw)).join("<br>")}</span></div>`}).join("")}`:"";
    box.innerHTML=(!q&&shown.length?`<h3 class="grp" style="margin:0 0 10px">最近の回の作品 <span>新しい回から順に表示しています</span></h3>`:"")+shown.map(g=>`<article class="film"><h2 class="${g.topic?'topic':''}">${hl(g.name,qRaw)}</h2>${
      g.hits.map(h=>`<div class="hit"><span class="ep">#${h.ep.no}</span>${tsHTML(h.ep,h.it)}<span class="sec">${esc(h.it.section||"")}</span></div>`).join("")
    }</article>`).join("")+(epsHTML?`<section class="film" style="margin-top:18px">${epsHTML}</section>`:"")+(!q&&arr.length>60?`<div class="empty">ほか ${arr.length-60} 件。検索で絞り込めます。</div>`:"");
  }

  function renderEps(){
    const box=$("#eplist");
    if(!episodes.length){box.innerHTML=`<div class="empty">まだ回が登録されていません。</div>`;return}
    box.innerHTML=[...episodes].sort((a,b)=>b.no-a.no).map(ep=>{
      const n=(ep.items||[]).reduce((a,i)=>a+i.films.length,0);
      return `<details class="eprow"><summary><span class="ep">#${ep.no}</span><span class="count">${n}作品・${(ep.items||[]).length}コーナー${ep.url?'':'・URL未登録'}</span></summary>
        <ol>${(ep.items||[]).map(it=>`<li>${tsHTML(ep,it)}<span>${esc(it.line)}</span></li>`).join("")}</ol>
        ${canWrite?`<div class="tools"><button class="btn ghost" type="button" data-edit="${ep.no}">編集</button><button class="btn danger" type="button" data-del="${ep.no}">削除</button></div>`:""}
      </details>`}).join("");
  }
  function renderStats(){
    const films=new Set(); episodes.forEach(e=>(e.items||[]).forEach(i=>i.films.forEach(f=>films.add(norm(f)))));
    $("#stats").textContent=episodes.length?`登録 ${episodes.length}回分・${films.size}作品`:"まだ回が登録されていません";
  }
  function all(){render();renderEps();renderStats()}

  // ---- タブ
  const tabs={search:"#view-search",eps:"#view-eps",add:"#view-add"};
  function show(name){for(const k in tabs){$(tabs[k]).hidden=k!==name;$("#tab-"+k).setAttribute("aria-selected",k===name)}
    try{localStorage.setItem("tab",name)}catch(e){}}
  for(const k in tabs) $("#tab-"+k).addEventListener("click",()=>show(k));
  // 入力欄を空にして、次の回を受け付ける状態に戻す
  function resetForm(){
    $("#f-no").value="";$("#f-url").value="";$("#f-text").value="";
    $("#f-preview").innerHTML="";$("#f-msg").textContent="";$("#f-msg").className="msg";
    $("#f-save").disabled=false;
    try{$("#f-no").focus({preventScroll:true})}catch(e){}
  }
  // 「回を追加」タブを押したら、いつでも保存できる状態に
  $("#tab-add").addEventListener("click",()=>{$("#f-save").disabled=false});
  $("#f-new").addEventListener("click",resetForm);
  $("#q").addEventListener("input",()=>{show("search");render()});

  // ---- 追加フォーム
  function preview(){
    const items=parse($("#f-text").value);
    const n=items.reduce((a,i)=>a+i.films.length,0);
    $("#f-preview").innerHTML=items.length?`<div class="note">読み取り結果：『』の作品 ${n}件（本文全体もキーワード検索の対象になります）</div><ol class="preview">${items.map(i=>`<li><span class="ts">${esc(i.t||"本文")}</span>${i.films.length?i.films.map(f=>"『"+esc(f)+"』").join(" "):"<em>"+esc(i.section)+"</em>"} <span class="sec">${i.films.length?esc(i.section):""}</span></li>`).join("")}</ol>`:"";
  }
  $("#f-text").addEventListener("input",()=>{preview();$("#f-save").disabled=false;$("#f-msg").textContent=""});
  for(const id of ["#f-no","#f-url"]) $(id).addEventListener("input",()=>{$("#f-save").disabled=false;$("#f-msg").textContent=""});
  $("#addform").addEventListener("submit",async e=>{
    e.preventDefault();
    const msg=$("#f-msg"); msg.className="msg";
    const no=parseInt($("#f-no").value,10), items=parse($("#f-text").value), url=$("#f-url").value.trim();
    if(!no){msg.className="msg err";msg.textContent="回番号を入れてください";return}
    const text=trimText($("#f-text").value);
    if(!text){msg.className="msg err";msg.textContent="概要欄のテキストを貼り付けてください";return}
    if(!art){msg.className="msg err";msg.textContent="このページを編集できる人だけが保存できます";return}
    $("#f-save").disabled=true; msg.textContent="保存中…";
    let cleanUrl=url; try{if(url){const u=new URL(url);u.searchParams.delete("si");cleanUrl=u.toString()}}catch(e){}
    const next=episodes.filter(x=>x.no!==no).concat([{no,url:cleanUrl,items,text}]);
    try{
      await persist(next);
      episodes=next; all();
      resetForm();
      msg.className="msg ok";msg.textContent=`#${no} を保存しました。続けて次の回を入力できます`;
    }catch(err){
      msg.className="msg err";
      msg.textContent=err&&err.code==="conflict"?"別の保存と重なりました。読み込み直した後にもう一度保存してください"
        :(err&&(err.code==="not_granted"||err.code==="not_writer"))?"このページを編集できる人だけが保存できます"
        :"保存できませんでした。少し待って再度お試しください";
      $("#f-save").disabled=false;
    }
  });

  // ---- 編集・削除（ページ内確認）
  $("#eplist").addEventListener("click",async e=>{
    const ed=e.target.closest("[data-edit]"), del=e.target.closest("[data-del]");
    if(ed){const ep=episodes.find(x=>x.no==ed.dataset.edit);if(!ep)return;
      $("#f-no").value=ep.no;$("#f-url").value=ep.url||"";
      $("#f-text").value=ep.text||(ep.items||[]).map(i=>(i.t?i.t+" ":"")+i.line).join("\n");preview();show("add");}
    if(del){
      if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="もう一度押すと削除";setTimeout(()=>{del.dataset.armed="";del.textContent="削除"},3000);return}
      del.textContent="削除中…";
      const next=episodes.filter(x=>String(x.no)!==del.dataset.del);
      try{await persist(next);episodes=next;all()}catch(err){del.textContent="削除できませんでした"}
    }
  });

  episodes=episodes.map(ep=>Object.assign({},ep,{items:dedupe(ep.items)}));
  try{const t=localStorage.getItem("tab");if(t&&t!=="add"&&tabs[t])show(t)}catch(e){}
  all();

  // 編集できる人にだけ「回を追加」と編集・削除を出す
  (async()=>{
    if(!window.claude||!window.claude.use) return;
    const user=await window.claude.use("user");
    const ok=user?(user.canEdit?await user.canEdit():false):false;
    if(!ok) return;
    art=await window.claude.use("artifact");
    if(!art) return;
    canWrite=true; $("#tab-add").hidden=false; renderEps();
  })();
})();
</script>
</body></html>
